name: Daily Prediction with Auto-Fetch

on:
  schedule:
    # Runs at 2 AM UTC daily (before evening draws in Ghana)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install deps
        run: pip install -q requests pg8000
      
      - name: Determine games
        id: schedule
        run: |
          DAY=$(date -u +%A)
          case $DAY in
            Monday) TODAY="Monday Special"; YESTERDAY="Sunday Aseda" ;;
            Tuesday) TODAY="Lucky Tuesday"; YESTERDAY="Monday Special" ;;
            Wednesday) TODAY="MidWeek"; YESTERDAY="Lucky Tuesday" ;;
            Thursday) TODAY="Fortune Thursday"; YESTERDAY="MidWeek" ;;
            Friday) TODAY="Friday Bonanza"; YESTERDAY="Fortune Thursday" ;;
            Saturday) TODAY="National Weekly"; YESTERDAY="Friday Bonanza" ;;
            Sunday) TODAY="Sunday Aseda"; YESTERDAY="National Weekly" ;;
          esac
          DATE=$(date -u +%Y-%m-%d)
          YEST_DATE=$(date -u -d "yesterday" +%Y-%m-%d)
          echo "today=$TODAY" >> $GITHUB_OUTPUT
          echo "yesterday=$YESTERDAY" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "yest_date=$YEST_DATE" >> $GITHUB_OUTPUT
          echo "day=$DAY" >> $GITHUB_OUTPUT
      
      - name: Fetch yesterday's results
        id: fetch
        run: |
          YESTERDAY="${{ steps.schedule.outputs.yesterday }}"
          YEST_DATE="${{ steps.schedule.outputs.yest_date }}"
          
          DATA="data[Lottery][name]=$YESTERDAY&data[Lottery][date]=$YEST_DATE&_method=POST"
          RESP=$(curl -s -X POST "https://www.ghanayello.com/lottery/results/history" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Referer: https://www.ghanayello.com/lottery/results/history" \
            -H "User-Agent: Mozilla/5.0" \
            -d "$DATA")
          
          # Parse with Python
          python3 << 'EOF'
import sys, re
from html.parser import HTMLParser

class Parser(HTMLParser):
    def __init__(self):
        super().__init__()
        self.in_table = False
        self.in_row = False
        self.in_cell = False
        self.cell_idx = 0
        self.current = {}
        self.draws = []
        self.row_count = 0
    
    def handle_starttag(self, tag, attrs):
        attrs = dict(attrs)
        if tag == "table": self.in_table = True
        elif tag == "tr" and self.in_table:
            self.in_row = True; self.cell_idx = 0; self.current = {}
        elif tag in ("td", "th") and self.in_row:
            self.in_cell = True
            self.current[f"cell{self.cell_idx}_title"] = attrs.get("title", "")
            self.current[f"cell{self.cell_idx}_data"] = ""
        elif tag == "div" and self.in_cell:
            cls = attrs.get("class", "")
            if "lotto_no_r" in cls or "lotto_no_w" in cls:
                self.current.setdefault("numbers", []).append("")
    
    def handle_endtag(self, tag):
        if tag in ("td", "th") and self.in_cell:
            self.in_cell = False; self.cell_idx += 1
        elif tag == "tr" and self.in_row:
            self.in_row = False
            if self.row_count > 0 and self.current: self.draws.append(self.current)
            self.row_count += 1
        elif tag == "table": self.in_table = False
    
    def handle_data(self, data):
        if self.in_cell:
            self.current[f"cell{self.cell_idx}_data"] = (self.current.get(f"cell{self.cell_idx}_data", "") + data).strip()

parser = Parser()
parser.feed(sys.argv[1])

if parser.draws:
    row = parser.draws[0]
    win_title = row.get("cell2_title", "")
    mach_title = row.get("cell3_title", "")
    date_data = row.get("cell0_data", "")
    
    win_m = re.search(r"Winning Numbers\s+([\d\-]+)", win_title)
    mach_m = re.search(r"Machine Numbers\s+([\d\-]+)", mach_title)
    
    if win_m: print(f"WIN={win_m.group(1)}")
    if mach_m: print(f"MACH={mach_m.group(1)}")
    if date_data: print(f"DATE={date_data}")
EOF
          
          WIN=$(python3 -c "
