          if [ -z "$WIN" ]; then
            echo "No results for $YESTERDAY on $YEST_DATE"
            exit 1
          fi
          
          echo "win=$WIN" >> $GITHUB_OUTPUT
          echo "mach=$MACH" >> $GITHUB_OUTPUT
          echo "Fetched: $WIN | Machine: $MACH"
      
      - name: Save to database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python3 << 'PYEOF'
import os, sys, pg8000

DATABASE_URL = os.getenv("DATABASE_URL")
game = sys.argv[1]
win = sys.argv[2]
mach = sys.argv[3] if len(sys.argv) > 3 else ""
date_str = sys.argv[4]

# Parse DB URL
url = DATABASE_URL.replace("postgresql://", "")
creds, rest = url.split("@", 1)
user, pwd = creds.split(":", 1)
host_port, db = rest.split("/", 1)[0], rest.split("/", 1)[1].split("?")[0]
host, port = (host_port.split(":") + ["5432"])[:2]

win_nums = [int(x) for x in win.split("-")]
mach_nums = [int(x) for x in mach.split("-")] if mach else [None]*5

# Pad to 5
win_nums += [0]*(5-len(win_nums))
mach_nums += [None]*(5-len(mach_nums))

conn = pg8000.connect(user=user, password=pwd, host=host, port=int(port), database=db, ssl_context=True)
cur = conn.cursor()

# Check exists
cur.execute("SELECT 1 FROM draws WHERE game_name=%s AND draw_date=%s", (game, date_str))
if not cur.fetchone():
    cur.execute("SELECT COALESCE(MAX(seq_id),0)+1 FROM draws")
    seq = cur.fetchone()[0]
    cur.execute("""INSERT INTO draws (seq_id, game_name, day_of_week, draw_date,
                win_n1,win_n2,win_n3,win_n4,win_n5,win_n6,
                mach_n1,mach_n2,mach_n3,mach_n4,mach_n5,mach_n6,event_id)
                VALUES (%s,%s,%s,%s, %s,%s,%s,%s,%s,%s, %s,%s,%s,%s,%s,%s,%s)""",
        (seq, game, {"Monday Special":"Monday","Lucky Tuesday":"Tuesday","MidWeek":"Wednesday",
                      "Fortune Thursday":"Thursday","Friday Bonanza":"Friday",
                      "National Weekly":"Saturday","Sunday Aseda":"Sunday"}[game],
         date_str,
         win_nums[0],win_nums[1],win_nums[2],win_nums[3],win_nums[4],0,
         mach_nums[0],mach_nums[1],mach_nums[2],mach_nums[3],mach_nums[4],None,
         "Lotto Draw Event"))
    conn.commit()
    print(f"Saved: {game} {date_str} Win={win} Mach={mach}")
else:
    print(f"Already exists: {game} {date_str}")

cur.close(); conn.close()
PYEOF
      
      - name: Generate prediction for today
        id: predict
        env:
          API_URL: https://vercel-deploy-phi-umber.vercel.app
        run: |
          TODAY="${{ steps.schedule.outputs.today }}"
          DATE="${{ steps.schedule.outputs.date }}"
          RESP=$(curl -s -X POST "$API_URL/predict" \
            -H "Content-Type: application/json" \
            -d "{\"game\": \"$TODAY\", \"model\": \"gap_cold\", \"top_k\": 7}")
          
          if echo "$RESP" | grep -q '"detail"'; then
            echo "Prediction failed: $RESP"; exit 1
          fi
          
          NUMBERS=$(echo "$RESP" | python -c "import sys,json; d=json.load(sys.stdin); print(' '.join(str(n['number']) for n in d['top_numbers']))")
          METRICS=$(echo "$RESP" | python -c "import sys,json; d=json.load(sys.stdin); m=d['metrics']; print(f\"Odd/Even: {m['odd_count']}/{m['even_count']} | High/Low: {m['high_count']}/{m['low_count']} | Sum: {m['sum_digits']} | Avg: {m['average']:.1f} | Spread: {m['spread']}\")")
          
          echo "numbers=$NUMBERS" >> $GITHUB_OUTPUT
          echo "metrics=$METRICS" >> $GITHUB_OUTPUT
          echo "raw=$RESP" >> $GITHUB_OUTPUT
      
      - name: Save prediction
        run: |
          DATE="${{ steps.schedule.outputs.date }}"
          GAME="${{ steps.schedule.outputs.today }}"
          DAY="${{ steps.schedule.outputs.day }}"
          NUMBERS="${{ steps.predict.outputs.numbers }}"
          METRICS="${{ steps.predict.outputs.metrics }}"
          RAW="${{ steps.predict.outputs.raw }}"
          
          mkdir -p predictions
          cat > "predictions/${DATE}.json" << EOF
          {
            "date": "${DATE}", "day": "${DAY}", "game": "${GAME}",
            "model": "gap_cold", "numbers": [$(echo "$NUMBERS" | sed 's/ /, /g')],
            "metrics": "${METRICS}", "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "$RAW" > "predictions/${DATE}_raw.json"
      
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions/
          if ! git diff --staged --quiet; then
            git commit -m "Daily: ${{ steps.schedule.outputs.today }} prediction for ${{ steps.schedule.outputs.date }} + fetched ${{ steps.schedule.outputs.yesterday }} results"
            git push
          fi