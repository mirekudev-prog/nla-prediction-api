name: Daily NLA Pipeline

on:
  schedule:
    # Runs at 2 AM UTC daily (before 8 PM draws in Ghana)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: /github/workspace
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install -q requests pg8000
      
      - name: Run NLA Daily Pipeline
        run: |
          python .github/actions/nla-daily/pipeline.py
      
      - name: Commit predictions
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions/
          if ! git diff --staged --quiet; then
            git commit -m "Daily: $(date -u +%Y-%m-%d) predictions + fetched draws"
            git push
          else
            echo "No changes to commit"
          fi