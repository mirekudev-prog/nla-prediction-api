<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ghana NLA 5/90 lottery predictions - simple, free, no nonsense">
  <title>NLA 5/90 Predictions</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #faf9f6;
      color: #1a1a2e;
      min-height: 100vh;
      padding: 24px 16px;
      line-height: 1.5;
    }
    .wrap { max-width: 420px; margin: 0 auto; }
    header {
      text-align: center;
      padding: 16px 0 8px;
    }
    h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.5px; color: #0f172a; margin-bottom: 4px; }
    .tagline { font-size: 14px; color: #64748b; font-weight: 400; }
    
    /* ── time banner ── */
    .time-banner {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; background: #f0f9ff; border-radius: 8px; margin-bottom: 16px;
      font-size: 12px; color: #0369a1;
    }
    .time-banner .badge {
      background: #0ea5e9; color: #fff; padding: 2px 8px; border-radius: 999px; font-weight: 600;
    }
    
    /* ── yesterday's draw ── */
    .yesterday {
      background: #fff; border: 2px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 16px;
    }
    .yesterday h3 { font-size: 14px; font-weight: 600; color: #0f172a; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .yesterday .balls { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
    .yesterday .ball { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }
    .yesterday .ball.win.low { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); }
    .yesterday .ball.win.high { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
    .yesterday .ball.mach { background: #64748b; border: 2px dashed #cbd5e1; font-size: 10px; }
    .yesterday .labels { display: flex; justify-content: center; gap: 16px; font-size: 10px; color: #94a3b8; }
    .yesterday .labels span { display: flex; align-items: center; gap: 4px; }
    .yesterday .dot { width: 8px; height: 8px; border-radius: 50%; }
    .yesterday .dot.win.low { background: #f97316; }
    .yesterday .dot.win.high { background: #ef4444; }
    
    /* ── today's prediction ── */
    .prediction {
      background: #fff; border: 2px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 16px;
    }
    .prediction h3 { font-size: 14px; font-weight: 600; color: #0f172a; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .prediction .balls { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
    .prediction .ball { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }
    .prediction .ball.low { background: #f97316; }
    .prediction .ball.high { background: #ef4444; }
    .prediction .stats { display: flex; gap: 16px; justify-content: center; margin-bottom: 12px; }
    .prediction .stat { text-align: center; }
    .prediction .stat-val { font-size: 18px; font-weight: 600; color: #0f172a; display: block; }
    .prediction .stat-label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
    .prediction .meta { font-size: 12px; color: #64748b; text-align: center; margin-top: 8px; }
    .prediction .loading { text-align: center; color: #64748b; font-style: italic; }
    .prediction .error { background: #fee2e2; border: 1px solid #fecaca; color: #dc2626; padding: 12px; border-radius: 8px; margin-top: 12px; font-size: 13px; }
    
    /* ── game selector ── */
    .games { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px; }
    .game-btn { 
      flex: 1; min-width: 60px; padding: 8px 12px; border: 2px solid #e2e8f0; 
      border-radius: 8px; background: #fff; color: #475569; font-size: 13px; 
      cursor: pointer; transition: all 0.2s; font-weight: 500;
    }
    .game-btn:hover { border-color: #cbd5e1; background: #f8fafc; }
    .game-btn.active { border-color: #10b981; background: #ecfdf5; color: #059669; }
    
    /* ── loading states ── */
    .loading { text-align: center; color: #64748b; font-style: italic; padding: 20px; }
    .error { background: #fee2e2; border: 1px solid #fecaca; color: #dc2626; padding: 12px; border-radius: 8px; margin-top: 12px; font-size: 13px; }
    
    /* ── responsive ── */
    @media (max-width: 480px) {
      .time-banner { flex-direction: column; gap: 8px; text-align: center; }
      .games .game-btn { flex: 1; min-width: 50px; font-size: 12px; padding: 6px 8px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>NLA 5/90 Predictions</h1>
      <p class="tagline">Ghana National Lottery Authority</p>
    </header>
    
    <!-- Time Banner -->
    <div class="time-banner" id="timeBanner">
      <span>🇬🇭 Ghana · Loading...</span>
      <span class="badge">Today: Loading...</span>
    </div>
    
    <!-- Yesterday's Draw -->
    <div class="yesterday" id="yesterdayCard" style="display:none;">
      <h3>📅 Yesterday's Draw <span id="yesterdayGame"></span></h3>
      <div class="balls" id="yesterdayBalls"></div>
    </div>
    
    <!-- Today's Prediction -->
    <div class="prediction" id="predictionCard" style="display:none;">
      <h3>🔮 Today's Prediction <span id="predictionGame"></span></h3>
      <div class="balls" id="predictionBalls"></div>
      <div class="stats" id="predictionStats"></div>
      <div class="meta" id="predictionMeta"></div>
      <div class="loading" id="predictionLoading" style="display:none;">Loading prediction...</div>
      <div class="error" id="predictionError" style="display:none;"></div>
    </div>
    
    <!-- Game Selector -->
    <div class="games" id="gamesContainer"></div>
  </div>

  <script>
    // ── Constants ──
    const DAY_TO_GAME = {
      Mon: "Monday Special",
      Tue: "Lucky Tuesday", 
      Wed: "MidWeek",
      Thu: "Fortune Thursday",
      Fri: "Friday Bonanza",
      Sat: "National Weekly",
      Sun: "Sunday Aseda"
    };
    
    const GITHUB_RAW = "https://raw.githubusercontent.com/mirekudev-prog/nla-prediction-api/master/predictions";
    
    // ── DOM Elements ──
    const q = (sel) => document.querySelector(sel);
    const qs = (sel) => document.querySelectorAll(sel);
    
    // ── Time-aware helpers (Ghana = UTC) ──
    function getTodayGame() { return DAY_TO_GAME[new Date().toLocaleDateString('en-US', { weekday: 'short', timeZone: 'UTC' })]; }
    function getYesterdayGame() { 
      const d = new Date(); d.setDate(d.getDate() - 1); 
      return DAY_TO_GAME[d.toLocaleDateString('en-US', { weekday: 'short', timeZone: 'UTC' })]; 
    }
    function getTodayDateStr() { return new Date().toISOString().split('T')[0]; }
    function getYesterdayDateStr() { const d = new Date(); d.setDate(d.getDate() - 1); return d.toISOString().split('T')[0]; }
    function fmtDate(dateStr) { return new Date(dateStr + 'T00:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); }
    
    // ── State ──
    let selGame = getTodayGame(); // Currently selected game for tabs
    
    // ── Initialization ──
    async function init() {
      renderTimeBanner();
      renderGameTabs();
      await loadYesterdayDraw();
      await loadTodaysPredictionFromGitHub();
    }
    
    // ── Render time banner ──
    function renderTimeBanner() {
      const todayGame = getTodayGame();
      const today = new Date();
      q('#timeBanner').innerHTML = `
        <span>🇬🇭 Ghana · ${today.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' })}</span>
        <span class="badge">Today: ${todayGame}</span>
      `;
    }
    
    // ── Render game tabs ──
    function renderGameTabs() {
      const gamesContainer = q('#gamesContainer');
      const games = Object.values(DAY_TO_GAME);
      
      gamesContainer.innerHTML = games.map(game => 
        `<button class="game-btn ${game === selGame ? 'active' : ''}" data-game="${game}">${game}</button>`
      ).join('');
      
      qs('.game-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const game = btn.getAttribute('data-game');
          if (game && game !== selGame) {
            selGame = game;
            updateActiveTab();
            loadYesterdayDraw();
            loadTodaysPredictionFromGitHub();
          }
        });
      });
    }
    
    function updateActiveTab() {
      qs('.game-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-game') === selGame);
      });
    }
    
    // ── Load yesterday's draw from Neon DB via API ──
    async function loadYesterdayDraw() {
      const yesterdayGame = getYesterdayGame();
      const yesterdayDate = getYesterdayDateStr();
      
      try {
        // In a real implementation, this would fetch from your API
        // For now, we'll simulate or skip since we're focusing on the prediction display
        // The actual draw data comes from the pipeline and is stored in the predictions folder
        // But for yesterday's draw, we'd need to fetch it from the DB or API
        
        // Since we're simplifying and focusing on the prediction display as requested,
        // we'll hide this section for now or implement a basic version
        q('#yesterdayCard').style.display = 'none';
        
        // TODO: Implement actual yesterday's draw loading from API if needed
        // For now, we'll focus on the core prediction display
        
      } catch(e) {
        console.warn('yesterday draw failed', e);
        q('#yesterdayCard').style.display = 'none';
      }
    }
    
    // ── Load today's prediction from GitHub repo ──
    async function loadTodaysPredictionFromGitHub() {
      const todayGame = getTodayGame();
      const todayDate = getTodayDateStr();
      selGame = todayGame;
      renderGameTabs();
      
      // Show loading state
      q('#predictionLoading').style.display = 'block';
      q('#predictionError').style.display = 'none';
      q('#predictionCard').style.display = 'none';
      
      try {
        const r = await fetch(`${GITHUB_RAW}/${todayDate}.json`);
        if (!r.ok) {
          // Prediction not yet committed (GitHub Actions hasn't run or hasn't pushed)
          q('#predictionError').textContent = `Prediction for ${todayDate} not yet available. GitHub Actions runs at 2 AM UTC.`;
          q('#predictionError').style.display = 'block';
          return;
        }
        const pred = await r.json();
        showPrediction(pred);
      } catch(e) {
        console.warn('GitHub prediction load failed', e);
        q('#predictionError').textContent = 'Failed to load prediction. Please try again later.';
        q('#predictionError').style.display = 'block';
      } finally {
        q('#predictionLoading').style.display = 'none';
      }
    }
    
    // ── Show prediction ──
    function showPrediction(pred) {
      // Hide error, show card
      q('#predictionError').style.display = 'none';
      q('#predictionCard').style.display = 'block';
      
      // Set game title
      q('#predictionGame').textContent = `${pred.game}`;
      
      // Show numbers
      const numbers = pred.numbers || [];
      q('#predictionBalls').innerHTML = numbers.map((n, i) => `
        <div class="ball ${n>45?'high':'low'}" style="animation-delay:${i*0.04}s">
          ${String(n).padStart(2,'0')}
        </div>
      `).join('');
      
      // Show metrics
      const metrics = pred.metrics || {};
      if (metrics && Object.keys(metrics).length > 0) {
        q('#predictionStats').innerHTML = `
          <div class="stat"><div class="stat-val">${metrics.odd_count}/${metrics.even_count}</div><div class="stat-label">Odd / Even</div></div>
          <div class="stat"><div class="stat-val">${metrics.high_count}/${metrics.low_count}</div><div class="stat-label">High / Low</div></div>
          <div class="stat"><div class="stat-val">${metrics.sum_digits}</div><div class="stat-label">Sum Digits</div></div>
          <div class="stat"><div class="stat-val">${metrics.average?.toFixed(1) || metrics.average}</div><div class="stat-label">Average</div></div>
        `;
      } else {
        q('#predictionStats').innerHTML = '';
      }
      
      // Show meta info
      q('#predictionMeta').textContent = `Generated at ${new Date(pred.generated_at || Date.now()).toLocaleTimeString('en-GB', { timeZone: 'UTC' })}`;
    }
    
    // ── Initialize on load ──
    init();
  </script>
</body>
</html>
